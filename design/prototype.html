<style>
/* Layout: show column (cover art, rav, dedications) beside a tabbed shiur panel; a full-width player bar docks at the bottom. Single column on phones. */
:root {
  --bg: #e8eef2;
  --surface: #ffffff;
  --ink: #0e1630;
  --muted: #5f6984;
  --faint: #959eb5;
  --line: #dde3ec;
  --accent: #1d3fd1;
  --accent-ink: #ffffff;
  --accent-soft: #e7ecff;
  --mark: #fff0b3;
  --cover-a: #2d55ef;
  --cover-b: #0a2398;
  --shadow: 0 1px 2px rgba(14, 22, 48, .06), 0 8px 24px rgba(14, 22, 48, .06);
  --f-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-he: "Frank Ruhl Libre", "David", "Times New Roman", serif;
  --max: 70rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f1c; --surface: #141a2c; --ink: #e8ebf4; --muted: #9ba4bf; --faint: #6c7693; --line: #252d46;
    --accent: #7f99ff; --accent-ink: #0b0f1c; --accent-soft: #1c2548; --mark: #4d4114;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f1c; --surface: #141a2c; --ink: #e8ebf4; --muted: #9ba4bf; --faint: #6c7693; --line: #252d46;
  --accent: #7f99ff; --accent-ink: #0b0f1c; --accent-soft: #1c2548; --mark: #4d4114;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 1rem/1.55 var(--f-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: 7rem;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.he { font-family: var(--f-he); direction: rtl; unicode-bidi: isolate; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 1.1rem; height: 1.1rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.f { fill: currentColor; stroke: none; }

/* Prototype strip + top bar */
.proto { max-width: var(--max); margin: 0 auto; padding-block: .45rem; font-size: .75rem; color: var(--muted); text-align: center; }
.proto b { color: var(--accent); font-weight: 600; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); border-bottom: 1px solid var(--line);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.top-in { max-width: var(--max); margin: 0 auto; height: 3.5rem; display: flex; align-items: center; gap: 2rem; }
.word { text-decoration: none; font-weight: 600; letter-spacing: .22em; font-size: .9rem; }
.top nav { display: flex; gap: 1.5rem; margin-right: auto; }
.top nav a { text-decoration: none; color: var(--muted); font-size: .92rem; font-weight: 500; }
.top nav a[aria-current="page"] { color: var(--ink); }
.icon-btn { width: 2.4rem; height: 2.4rem; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.icon-btn:hover { background: var(--surface); }

/* Page layout */
.page { max-width: var(--max); margin: 0 auto; padding-block: 2.5rem 2rem; }
.layout { display: grid; grid-template-columns: 17.5rem minmax(0, 1fr); grid-template-areas: "top main" "more main"; grid-template-rows: auto 1fr; gap: 0 4rem; align-items: start; }
.side-top { grid-area: top; display: grid; gap: 1.1rem; }
.side-more { grid-area: more; display: grid; gap: 0; padding-top: 1.5rem; }
.main-col { grid-area: main; display: grid; gap: 2rem; min-width: 0; }

/* Cover art: the block echoes a page of Gemara, text in the center and commentary around it */
.cover { container-type: inline-size; position: relative; width: 100%; max-width: 100%; aspect-ratio: 1; overflow: hidden; color: #fff;
  background: linear-gradient(155deg, var(--cover-a), var(--cover-b)); box-shadow: 0 10px 30px rgba(10, 35, 152, .25); border-radius: 4px; }
.cv-page { position: absolute; top: 9cqw; left: 9cqw; right: 9cqw; height: 40cqw; display: grid; grid-template-columns: 1fr 2.2fr 1fr; gap: 3cqw; }
.cv-page i { background: rgba(255, 255, 255, .09); }
.cv-page i:nth-child(2) { background: rgba(255, 255, 255, .2); }
.cv-he { position: absolute; right: 9cqw; bottom: 25cqw; font: 700 17cqw/1 var(--f-he); direction: rtl; white-space: nowrap; }
.cv-en { position: absolute; left: 9cqw; bottom: 13.5cqw; font-size: 6.2cqw; letter-spacing: .2em; font-weight: 500; white-space: nowrap; }
.cv-by { position: absolute; left: 9cqw; bottom: 8cqw; font-size: 4cqw; letter-spacing: .24em; opacity: .7; white-space: nowrap; }
.cover.sm .cv-page { display: none; }
.cover.sm .cv-he { bottom: 30cqw; font-size: 26cqw; right: 12cqw; }
.cover.sm .cv-en, .cover.sm .cv-by { display: none; }

.show-name { font-size: 1.2rem; font-weight: 700; margin: 0; line-height: 1.25; color: var(--ink); }
.by { font-size: .82rem; color: var(--muted); }
.by b { display: block; color: var(--ink); font-weight: 600; font-size: .9rem; }
.actions { display: flex; gap: .6rem; flex-wrap: wrap; }
.btn { border: 0; border-radius: 6px; padding: .55rem 1.1rem; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: .88rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: .45rem; }
.btn.ghost { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.btn.wide { width: 100%; justify-content: center; padding-block: .75rem; }
.block { display: grid; gap: .55rem; padding-block: 1.4rem; border-top: 1px solid var(--line); }
.block-head { display: flex; justify-content: space-between; gap: 1rem; font-weight: 600; font-size: .95rem; }
.block p { margin: 0; font-size: .86rem; color: var(--muted); line-height: 1.6; }
.block dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: .45rem 1rem; font-size: .88rem; }
.block dt { color: var(--muted); }
.block dd { margin: 0; text-align: right; font-weight: 500; }
.dafbox { display: flex; gap: .5rem; }
.dafbox input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: .55rem .7rem; }

.lede { font-size: 1.6rem; line-height: 1.4; font-weight: 400; margin: 0; max-width: 34ch; text-wrap: pretty; }
.lede b { font-weight: 700; }
.stats { display: flex; gap: 2.75rem; flex-wrap: wrap; }
.stat small { display: block; font-size: .78rem; color: var(--muted); }
.stat b { font-size: 1.35rem; font-weight: 600; }
.stat .he { font-size: 1.35rem; font-weight: 700; }

/* Panel with tabs */
.panel { background: var(--surface); box-shadow: var(--shadow); border-radius: 4px; min-width: 0; }
.tabs { display: flex; gap: 1.75rem; padding: 0 1.5rem; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab { flex: none; text-decoration: none; color: var(--faint); font-weight: 500; font-size: .92rem; padding: 1.1rem 0 1rem; border: 0; background: none; cursor: pointer; box-shadow: inset 0 -2px 0 transparent; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
.tools { display: flex; gap: .75rem; padding: 1rem 1.5rem; border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
.searchbox { flex: 1; min-width: 12rem; display: flex; align-items: center; gap: .5rem; background: var(--bg); border-radius: 6px; padding: 0 .75rem; color: var(--muted); }
.searchbox input { flex: 1; min-width: 0; border: 0; background: transparent; padding: .65rem 0; outline: none; color: var(--ink); }
.searchbox:focus-within { box-shadow: 0 0 0 2px var(--accent); }
.seg { display: inline-flex; background: var(--bg); border-radius: 6px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: .35rem .7rem; font-size: .8rem; font-weight: 500; color: var(--muted); border-radius: 4px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.hint { font-size: .78rem; color: var(--muted); padding: .75rem 1.5rem 0; margin: 0; }
.hint code { font-family: inherit; background: var(--accent-soft); color: var(--ink); padding: .05rem .35rem; border-radius: 4px; }
.notice { margin: 1rem 1.5rem 0; padding: .75rem 1rem; background: var(--accent-soft); border-radius: 6px; font-size: .9rem; }
.notice a { color: var(--accent); font-weight: 600; }
.count { font-size: .78rem; color: var(--faint); padding: 1rem 1.5rem 0; letter-spacing: .04em; }

.eps { list-style: none; margin: 0; padding: 0; }
.ep { display: grid; grid-template-columns: 2.25rem minmax(0, 1fr); gap: 1.1rem; padding: 1.35rem 1.5rem; border-top: 1px solid var(--line); }
.eps .ep:first-child { border-top: 0; }
.ep-play { width: 2.25rem; height: 2.25rem; border-radius: 50%; border: 1.5px solid var(--ink); background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--ink); margin-top: .1rem; }
.ep-play svg { width: .8rem; height: .8rem; }
.ep-play[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ep-body { text-decoration: none; display: grid; gap: .3rem; min-width: 0; }
.ep-meta { font-size: .7rem; letter-spacing: .07em; color: var(--faint); font-weight: 500; text-transform: uppercase; display: flex; gap: .5rem; flex-wrap: wrap; }
.ep-meta .dot::before { content: "•"; margin-right: .5rem; }
.ep-title { font-size: 1.08rem; font-weight: 600; line-height: 1.35; }
.ep-body:hover .ep-title { color: var(--accent); }
.ep-sum { font-size: .88rem; color: var(--muted); margin: 0; line-height: 1.55; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 .1em; }
.empty { padding: 2rem 1.5rem; color: var(--muted); }

/* Shiur page */
.crumbs { font-size: .82rem; color: var(--muted); display: flex; gap: .5rem; flex-wrap: wrap; }
.crumbs a { text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.eyebrow { font-size: .72rem; letter-spacing: .09em; color: var(--faint); font-weight: 600; text-transform: uppercase; }
h1.title { font-size: 2.2rem; line-height: 1.15; font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.dafline { display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap; color: var(--muted); font-size: .92rem; }
.dafline .he { font-size: 1.15rem; color: var(--accent); font-weight: 700; }
.playrow { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.big-play { width: 3.5rem; height: 3.5rem; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; }
.big-play svg { width: 1.2rem; height: 1.2rem; }
.playrow .lbl b { display: block; font-weight: 600; }
.playrow .lbl span { font-size: .85rem; color: var(--muted); }
.summary { font-size: 1.2rem; line-height: 1.55; margin: 0; max-width: 40ch; }
.chapters { list-style: none; margin: 0; padding: .5rem 0; }
.chapters button { width: 100%; display: grid; grid-template-columns: 4.5rem 1fr; gap: .75rem; text-align: left; background: none; border: 0; padding: .8rem 1.5rem; cursor: pointer; font-size: .95rem; }
.chapters button:hover { background: var(--bg); }
.chapters .ts { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.transcript { padding: 1.25rem 1.5rem; display: grid; gap: 1rem; max-width: 70ch; }
.transcript p { margin: 0; line-height: 1.7; }
.transcript .ts { display: block; font-size: .72rem; color: var(--faint); font-weight: 600; letter-spacing: .05em; font-variant-numeric: tabular-nums; }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.pn a { text-decoration: none; background: var(--surface); box-shadow: var(--shadow); border-radius: 4px; padding: 1rem 1.2rem; display: grid; gap: .2rem; min-width: 0; }
.pn a:hover b { color: var(--accent); }
.pn a.next { text-align: right; }
.pn small { font-size: .72rem; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.pn b { font-weight: 600; font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prose { max-width: 60ch; display: grid; gap: 1rem; }
.prose p { margin: 0; color: var(--muted); }
.prose h2 { margin: .5rem 0 0; font-size: 1.15rem; }

/* Player bar */
.pbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--surface); box-shadow: 0 -1px 0 var(--line), 0 -6px 20px rgba(14, 22, 48, .06);
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) 0; }
.pb-in { display: grid; grid-template-columns: 4.5rem minmax(9rem, 15rem) auto minmax(0, 1fr) auto; align-items: center; gap: 1.5rem; height: 4.5rem; }
.pb-art { width: 4.5rem; height: 4.5rem; }
.pb-art .cover { border-radius: 0; box-shadow: none; }
.pb-info { text-decoration: none; min-width: 0; display: grid; }
.pb-info b { font-weight: 600; font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pb-info span { font-size: .7rem; letter-spacing: .07em; color: var(--faint); text-transform: uppercase; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb-ctrls { display: flex; align-items: center; gap: .6rem; }
.pill { height: 2.1rem; min-width: 3rem; border-radius: 999px; border: 1.5px solid var(--ink); background: transparent; display: grid; place-items: center; font-size: .8rem; font-weight: 600; cursor: pointer; padding: 0 .6rem; }
.pb-play { width: 2.6rem; height: 2.6rem; border-radius: 50%; border: 1.5px solid var(--ink); background: transparent; display: grid; place-items: center; cursor: pointer; }
.pb-play svg { width: 1rem; height: 1rem; }
.pb-scrub { display: flex; align-items: center; gap: .75rem; font-size: .72rem; color: var(--faint); font-variant-numeric: tabular-nums; min-width: 0; }
.bar { position: relative; flex: 1; height: 3px; background: var(--line); border-radius: 2px; cursor: pointer; min-width: 4rem; }
.bar::after { content: ""; position: absolute; inset: -10px 0; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 2px; }
.bar b { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.pb-end { padding-right: .25rem; }

.toast { position: fixed; left: 50%; bottom: 6rem; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: .6rem 1rem; border-radius: 6px; font-size: .88rem; z-index: 8; max-width: calc(100% - 32px); text-align: center; }

@media (max-width: 960px) {
  .pb-in { grid-template-columns: 4.5rem minmax(0, 1fr) auto; grid-template-rows: auto; gap: 1rem; }
  .pb-scrub { position: absolute; left: 0; right: 0; top: -1px; }
  .pb-scrub span, .pb-end, .pb-skip { display: none; }
  .pb-scrub .bar b { display: none; }
}
@media (max-width: 860px) {
  .page { padding-top: 1.5rem; }
  .layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "main" "more"; gap: 0; }
  .side-top { grid-template-columns: 7.5rem minmax(0, 1fr); align-items: center; column-gap: 1.1rem; row-gap: .8rem; margin-bottom: 1.75rem; }
  .side-top > .cover { grid-row: span 2; }
  .side-top > .actions { grid-column: 1 / -1; }
  .side-top > .block { grid-column: 1 / -1; }
  .side-more { padding-top: 2rem; }
  .lede { font-size: 1.25rem; }
  .stats { gap: 1.5rem; }
  .stat b { font-size: 1.15rem; }
  .ep-meta { letter-spacing: .04em; gap: .35rem; }
  .ep-meta .dot::before { margin-right: .35rem; }
  h1.title { font-size: 1.7rem; }
  .tabs, .tools, .ep, .chapters button, .transcript { padding-left: 1.1rem; padding-right: 1.1rem; }
  .hint, .count { padding-left: 1.1rem; padding-right: 1.1rem; }
  .notice { margin-inline: 1.1rem; }
  .top nav { gap: 1rem; }
  .top-in { gap: 1.25rem; }
}
@media (max-width: 420px) {
  .word { letter-spacing: .14em; font-size: .82rem; }
  .ep { grid-template-columns: 2rem minmax(0, 1fr); gap: .85rem; }
  .ep-play { width: 2rem; height: 2rem; }
  .pn { grid-template-columns: 1fr; }
  .pn a.next { text-align: left; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

// ---------- Derived catalog ----------
function dafIdx(d) { const m = /^(\d+)([ab])?$/.exec(d); return m ? +m[1] * 2 + (m[2] === "b" ? 1 : 0) : null; }
function heNum(n) {
  const ones = ["","א","ב","ג","ד","ה","ו","ז","ח","ט"], tens = ["","י","כ","ל","מ","נ","ס","ע","פ","צ"], hund = ["","ק","ר","ש","ת"];
  let s = hund[Math.floor(n / 100)] || ""; const r = n % 100;
  s += r === 15 ? "טו" : r === 16 ? "טז" : tens[Math.floor(r / 10)] + ones[r % 10];
  return s.length === 1 ? s + "׳" : s.slice(0, -1) + "״" + s.slice(-1);
}
function heDaf(d) { const m = /^(\d+)([ab])$/.exec(d); return m ? heNum(+m[1]) + (m[2] === "a" ? " ע״א" : " ע״ב") : ""; }
const dafRange = s => s.dafStart === s.dafEnd ? s.dafStart : s.dafStart + "–" + s.dafEnd;
const heRange = s => s.dafStart === s.dafEnd ? heDaf(s.dafStart) : heDaf(s.dafStart) + " – " + heDaf(s.dafEnd);
const fmtDate = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
const fmtTime = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, "0"); return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };

const SHIURIM = [];
MASECHTOS.forEach((m, mi) => {
  m.season = mi + 1;
  m.shiurim = m.items.map(([ds, de, title, summary], i) => {
    const given = new Date(m.start + "T00:00:00Z"); given.setUTCDate(given.getUTCDate() + 7 * i);
    const dur = (38 + ((i * 7 + m.slug.length * 3) % 21)) * 60 + ((i * 37) % 60);
    const s = { id: `${m.slug}-${i + 1}`, m, number: i + 1, dafStart: ds, dafEnd: de, title, summary, given, dur };
    SHIURIM.push(s); return s;
  });
});
SHIURIM.sort((a, b) => b.given - a.given);
const BY_ID = Object.fromEntries(SHIURIM.map(s => [s.id, s]));
const BY_SLUG = Object.fromEntries(MASECHTOS.map(m => [m.slug, m]));
const TOTAL_HOURS = Math.round(SHIURIM.reduce((a, s) => a + s.dur, 0) / 3600);

function chaptersFor(s) {
  const d = s.dur;
  return [
    [0, "Introduction and review of last week"],
    [Math.round(d * .08), `Reading the Ein Yaakov on ${s.m.name} ${s.dafStart}`],
    [Math.round(d * .30), s.title],
    [Math.round(d * .58), "Rashi, Maharsha and the Iyun Yaakov"],
    [Math.round(d * .80), "Questions from the audience"],
    [Math.round(d * .93), "Closing thought for the week"],
  ];
}
function transcriptFor(s) {
  const c = chaptersFor(s);
  return [
    [c[0][0], `Good evening. Last week we finished the previous piece in ${s.m.name}, and tonight we come to a new piece: ${s.title}.`],
    [c[1][0], `The Ein Yaakov brings the Gemara on daf ${s.dafStart}. Let's read it inside, slowly, and then ask what is bothering the Gemara here.`],
    [c[2][0], s.summary + " The question we want to ask is why Chazal chose to tell it this way, and what it is coming to teach us."],
    [c[3][0], "Rashi gives the simple reading. The Maharsha in the Chiddushei Aggados reads it differently, and the Iyun Yaakov adds a point we'll come back to."],
    [c[4][0], "A question from the back: does this apply in our times? It's a good question, and the Maharsha seems to address it."],
    [c[5][0], "So the takeaway for the week is a small one, but it's something each of us can carry into Shabbos."],
  ];
}

// ---------- Search ----------
const norm = t => t.toLowerCase().normalize("NFKD").replace(/[֑-ׇ]/g, "").replace(/[’'"״׳]/g, "").replace(/[^a-z0-9א-ת\s]/g, " ").replace(/\s+/g, " ").trim();
const resolveMasechta = word => { const w = norm(word); return MASECHTOS.find(m => norm(m.name) === w || m.he === word || m.aliases.includes(w)) || null; };
function findDaf(m, daf) {
  const d = String(daf).toLowerCase().replace(/^daf\s*/, "").trim();
  const x = /^(\d+)([ab])?$/.exec(d); if (!x) return { error: "Type a daf number like 17 or 17a." };
  const lo = dafIdx(x[1] + (x[2] || "a")), hi = x[2] ? lo : lo + 1;
  const hit = m.shiurim.find(s => dafIdx(s.dafStart) <= hi && dafIdx(s.dafEnd) >= lo);
  if (hit) return { hit, daf: x[1] + (x[2] || "") };
  const near = [...m.shiurim].sort((a, b) => Math.abs(dafIdx(a.dafStart) - lo) - Math.abs(dafIdx(b.dafStart) - lo))[0];
  return { near, daf: x[1] + (x[2] || "") };
}
function search(q, slug) {
  const words = norm(q).split(" ").filter(Boolean);
  let m = slug ? BY_SLUG[slug] : null, dafHit = null; const terms = [];
  for (let i = 0; i < words.length; i++) {
    const found = resolveMasechta(words[i]);
    if (found) { m = found; if (/^\d+[ab]?$/.test(words[i + 1] || "")) { dafHit = findDaf(m, words[++i]); } }
    else if (m && /^\d+[ab]?$/.test(words[i]) && !dafHit) dafHit = findDaf(m, words[i]);
    else terms.push(words[i]);
  }
  const pool = m ? m.shiurim : SHIURIM;
  if (!terms.length) return { m, dafHit, terms, results: dafHit ? [] : pool };
  const results = pool.map(s => {
    const t = norm(s.title), su = norm(s.summary), x = norm(transcriptFor(s).map(p => p[1]).join(" "));
    let score = 0;
    for (const w of terms) { if (t.includes(w)) score += 5; else if (su.includes(w)) score += 3; else if (x.includes(w)) score += 1; else return null; }
    return { s, score };
  }).filter(Boolean).sort((a, b) => b.score - a.score || b.s.given - a.s.given).map(r => r.s);
  return { m, dafHit, terms, results };
}

const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function hl(text, terms) {
  let out = esc(text);
  for (const t of terms || []) if (t.length > 1) out = out.replace(new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>");
  return out;
}

}

function viewAbout() {
  current.slug = "";
  return `<div class="layout">
    <div class="side-top">${cover()}</div>
    <div class="side-more">${sideBlocks()}</div>
    <section class="main-col prose">
      <span class="eyebrow">About the shiur</span>
      <h1 class="title">Ein Yaakov with ${RAV}</h1>
      <p>${RAV} gives a weekly shiur at the shul on the Ein Yaakov, Rabbi Yaakov ibn Chaviv's collection of the aggados of the Talmud. The shiur moves through each masechta in order, reading the Gemara inside with Rashi, the Maharsha and the commentaries printed alongside it.</p>
      <p>Every recorded shiur is here, dated by when it was given, and is also available as a podcast.</p>
      <h2>When and where</h2>
      <p>Day, time and location to be added.</p>
      <h2>Dedications</h2>
      <p>Dedication options to be set with the shul.</p>
    </section>
  </div>`;
}
const viewMissing = () => `<section class="prose"><h1 class="title">Shiur not found</h1><p>That page doesn't exist. <a href="#home">Browse all shiurim</a>.</p></section>`;

// ---------- Simulated player ----------
const player = { id: SHIURIM[0].id, pos: 0, on: false, rate: 1, timer: null };
const RATES = [1, 1.25, 1.5, 1.75, 2];
const playing = id => player.on && player.id === id;
function load(id, at) { if (player.id !== id) { player.id = id; player.pos = 0; } if (at != null) player.pos = at; }
function toggle(id) { if (player.id === id && player.on) player.on = false; else { load(id); player.on = true; } tick(); }
function tick() {
  clearInterval(player.timer);
  if (player.on) player.timer = setInterval(() => {
    const s = BY_ID[player.id]; player.pos = Math.min(s.dur, player.pos + player.rate);
    if (player.pos >= s.dur) { player.on = false; tick(); } else paint(false);
  }, 1000);
  paint(true);
}
function paint(full) {
  const s = BY_ID[player.id], pct = player.pos / s.dur * 100;
  document.querySelector("#pbBar i").style.width = pct + "%";
  document.querySelector("#pbBar b").style.left = pct + "%";
  document.getElementById("pbPos").textContent = fmtTime(player.pos);
  document.getElementById("pbLeft").textContent = "−" + fmtTime(s.dur - player.pos);
  if (!full) return;
  document.getElementById("pbArt").innerHTML = cover(s.m, true);
  const info = document.getElementById("pbInfo"); info.href = "#s-" + s.id;
  info.querySelector("b").textContent = s.title;
  info.querySelector("span").textContent = `${s.m.name} ${dafRange(s)} · ${fmtDate(s.given)}`;
  const pp = document.getElementById("pbPlay"); pp.innerHTML = player.on ? PAUSE : PLAY; pp.setAttribute("aria-label", player.on ? "Pause" : "Play");
  document.getElementById("pbRate").textContent = player.rate + "×";
  document.querySelectorAll("[data-play]").forEach(b => {
    const on = playing(b.dataset.play);
    b.innerHTML = on ? PAUSE : PLAY; b.setAttribute("aria-pressed", on);
    const lbl = b.parentElement.querySelector(".lbl b"); if (lbl) lbl.textContent = on ? "Playing" : "Play shiur";
  });
}

// ---------- Routing & events ----------
function route() {
  const h = location.hash.slice(1) || "home";
  let html, nav = "home";
  if (h === "home" || h === "search") html = viewHome();
  else if (h === "about") { html = viewAbout(); nav = "about"; }
  else if (h.startsWith("m-")) html = viewMasechta(h.slice(2));
  else if (h.startsWith("s-")) html = viewShiur(h.slice(2));
  else html = viewMissing();
  document.getElementById("view").innerHTML = html;
  document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav === nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  renderResults();
  paint(true);
  if (h === "search") focusSearch();
}
function focusSearch() { const q = document.getElementById("q"); if (q) { q.focus(); q.scrollIntoView({ block: "center" }); } else location.hash = "search"; }
let toastT;
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); }

document.addEventListener("input", e => { if (e.target.id === "q") { state.q = e.target.value; renderResults(); } });
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "dafjump") {
    const m = BY_SLUG[e.target.dataset.m], v = e.target.dafIn.value.trim(); const r = findDaf(m, v);
    if (r.hit) location.hash = "s-" + r.hit.id;
    else { state.q = v; const q = document.getElementById("q"); q.value = v; renderResults(); }
  }
});
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "searchBtn") focusSearch();
  else if (b.dataset.play) toggle(b.dataset.play);
  else if (b.id === "pbPlay") toggle(player.id);
  else if (b.id === "pbRate") { player.rate = RATES[(RATES.indexOf(player.rate) + 1) % RATES.length]; tick(); }
  else if (b.dataset.skip) { player.pos = Math.max(0, Math.min(BY_ID[player.id].dur, player.pos + +b.dataset.skip)); paint(false); }
  else if (b.dataset.jump) { const [id, t] = b.dataset.jump.split(":"); load(id, +t); player.on = true; tick(); }
  else if (b.dataset.sort) { if (current.slug) state.sortM = b.dataset.sort; else state.sortAll = b.dataset.sort; b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); renderResults(); }
  else if (b.dataset.stab) { state.stab = b.dataset.stab; route(); }
  else if (b.dataset.toast) toast(b.dataset.toast);
});
document.getElementById("pbBar").addEventListener("click", e => { const r = e.currentTarget.getBoundingClientRect(); player.pos = (e.clientX - r.left) / r.width * BY_ID[player.id].dur; paint(false); });
let lastView = "";
window.addEventListener("hashchange", () => {
  const h = location.hash.slice(1); const kind = h.startsWith("m-") || h === "home" || h === "" || h === "search" ? "list" : h;
  if (kind !== "list") state.q = "";
  route(); if (kind !== "list" || lastView !== "list") window.scrollTo(0, 0); lastView = kind;
});
route();
</script>
