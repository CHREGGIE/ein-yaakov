SHIURIM.sort((a, b) => b.given - a.given);
const BY_ID = Object.fromEntries(SHIURIM.map(s => [s.id, s]));
const BY_SLUG = Object.fromEntries(MASECHTOS.map(m => [m.slug, m]));

function chaptersFor(s) {
  const d = s.dur;
  return [
    [0, "Introduction and review of last week"],
    [Math.round(d * .08), `Reading the Ein Yaakov on ${s.m.name} ${s.dafStart}`],
    [Math.round(d * .30), s.title],
    [Math.round(d * .58), "Rashi, Maharsha and the Iyun Yaakov"],
    [Math.round(d * .80), "Questions from the audience"],
    [Math.round(d * .93), "Closing thought for the week"],
  ];
}
function transcriptFor(s) {
  const c = chaptersFor(s);
  return [
    [c[0][0], `Good evening. Last week we finished the previous piece in ${s.m.name}, and tonight we come to a new piece: ${s.title}.`],
    [c[1][0], `The Ein Yaakov brings the Gemara on daf ${s.dafStart}. Let's read it inside, slowly, and then ask what is bothering the Gemara here.`],
    [c[2][0], s.summary + " The question we want to ask is why Chazal chose to tell it this way, and what it is coming to teach us."],
    [c[3][0], "Rashi gives the simple reading. The Maharsha in the Chiddushei Aggados reads it differently, and the Iyun Yaakov adds a point we'll come back to."],
    [c[4][0], "A question from the back: does this apply in our times? It's a good question, and the Maharsha seems to address it."],
    [c[5][0], "So the takeaway for the week is a small one, but it's something each of us can carry into Shabbos."],
  ];
}

// ---------- Search ----------
const norm = t => t.toLowerCase().normalize("NFKD").replace(/[֑-ׇ]/g, "").replace(/[’'"״׳]/g, "").replace(/[^a-z0-9א-ת\s]/g, " ").replace(/\s+/g, " ").trim();
function resolveMasechta(word) {
  const w = norm(word);
  return MASECHTOS.find(m => norm(m.name) === w || m.he === word || m.aliases.includes(w)) || null;
}
function findDaf(m, daf) {
  const d = String(daf).toLowerCase().replace(/^daf\s*/, "").replace(/[.:]$/, x => x === "." ? "a" : "b");
  const m2 = /^(\d+)([ab])?$/.exec(d); if (!m2) return { error: "Type a daf number like 17 or 17a." };
  const lo = dafIdx(m2[1] + (m2[2] || "a")), hi = m2[2] ? lo : lo + 1;
  const hit = m.shiurim.find(s => dafIdx(s.dafStart) <= hi && dafIdx(s.dafEnd) >= lo);
  if (hit) return { hit, daf: m2[1] + (m2[2] || "") };
  const near = [...m.shiurim].sort((a, b) => Math.abs(dafIdx(a.dafStart) - lo) - Math.abs(dafIdx(b.dafStart) - lo))[0];
  return { near, daf: m2[1] + (m2[2] || "") };
}
function search(q, slug) {
  const nq = norm(q); const words = nq.split(" ").filter(Boolean);
  let pool = slug ? BY_SLUG[slug].shiurim : SHIURIM;
  let dafHit = null, terms = [];
  // "kesuvos 17a" or "ketubot 62b" goes straight to the daf
  for (let i = 0; i < words.length; i++) {
    const m = resolveMasechta(words[i]);
    if (m) {
      pool = m.shiurim; slug = m.slug;
      if (/^\d+[ab]?$/.test(words[i + 1] || "")) { dafHit = findDaf(m, words[i + 1]); i++; }
    } else terms.push(words[i]);
  }
  if (!terms.length) return { slug, dafHit, terms, results: dafHit ? [] : pool.slice().sort((a, b) => a.m.season - b.m.season || a.number - b.number) };
  const results = pool.map(s => {
    const hay = { t: norm(s.title), s: norm(s.summary), x: norm(transcriptFor(s).map(p => p[1]).join(" ")) };
    let score = 0;
    for (const t of terms) {
      if (hay.t.includes(t)) score += 5; else if (hay.s.includes(t)) score += 3; else if (hay.x.includes(t)) score += 1; else return null;
    }
    return { s, score };
  }).filter(Boolean).sort((a, b) => b.score - a.score || b.s.given - a.s.given).map(r => r.s);
  return { slug, dafHit, terms, results };
}

// ---------- Rendering ----------
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function hl(text, terms) {
  let out = esc(text); if (!terms || !terms.length) return out;
  for (const t of terms) { if (t.length < 2) continue; out = out.replace(new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>"); }
  return out;
}
const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
const PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';

function row(s, opts = {}) {
  return `<li><a class="row" href="#s-${s.id}">
    <span class="n num">${s.number}</span>
    <span class="body">
      <span class="t">${hl(s.title, opts.terms)}</span>
      <span class="sub">${opts.showM ? `<span>${esc(s.m.name)}</span>` : ""}<span class="daf num">${dafRange(s)}</span><span class="num">${fmtDate(s.given)}</span></span>
      ${opts.snip ? `<span class="snip">${hl(s.summary, opts.terms)}</span>` : ""}
    </span>
    <span class="len num">${Math.round(s.dur / 60)} min</span>
  </a></li>`;
}
function chips(active, name = "chip-m") {
  return `<div class="chips" role="group" aria-label="Filter by masechta">
    <button class="chip" data-${name}="" aria-pressed="${!active}">All masechtos</button>
    ${MASECHTOS.map(m => `<button class="chip" data-${name}="${m.slug}" aria-pressed="${active === m.slug}">${esc(m.name)}</button>`).join("")}
  </div>`;
}
function finder(q = "", slug = "") {
  return `<form class="finder" id="finder" role="search">
    <label for="q" class="eyebrow">Find a shiur</label>
    <div class="qrow"><input id="q" name="q" type="search" placeholder="Topic, story, or masechta and daf" value="${esc(q)}" autocomplete="off"><button class="btn">Search</button></div>
    ${chips(slug)}
    <div class="hint">Try <code>Kesuvos 17a</code>, <code>Ketubot 62b</code> or <code>Hillel</code>. Ashkenazi and Sephardi spellings both work.</div>
  </form>`;
}

const state = { q: "", slug: "", sort: "asc", dafMsg: "" };

function viewHome() {
  const latest = SHIURIM[0];
  const bySeder = SEDARIM.map(sd => ({ sd, ms: MASECHTOS.filter(m => m.seder === sd.key) })).filter(x => x.ms.length);
  return `
  <section class="latest" aria-label="Latest shiur">
    <span class="eyebrow">Latest shiur · ${fmtDate(latest.given)}</span>
    <h2><a href="#s-${latest.id}">${esc(latest.title)}</a></h2>
    <div class="meta num">${esc(latest.m.name)} ${dafRange(latest)} · Shiur ${latest.number} · ${Math.round(latest.dur / 60)} min</div>
    <button class="btn" data-play="${latest.id}">${playing(latest.id) ? "Pause" : "Play shiur"}</button>
  </section>
  ${finder(state.q, state.slug)}
  <section aria-labelledby="mh">
    <div class="sec-head"><h2 id="mh">Masechtos</h2><span class="muted num">${SHIURIM.length} shiurim</span></div>
    ${bySeder.map(({ sd, ms }) => `<div class="seder">
      <div class="seder-name"><span class="eyebrow">Seder ${sd.en}</span><span class="he" lang="he">סדר ${sd.he}</span></div>
      <div class="mgrid">${ms.map(m => `<a class="mcard" href="#m-${m.slug}"><span class="en">${m.name}</span><span class="he" lang="he">${m.he}</span><span class="ct num">${m.shiurim.length} shiurim · daf ${m.shiurim[0].dafStart}–${m.shiurim.at(-1).dafEnd}</span></a>`).join("")}</div>
    </div>`).join("")}
  </section>
  <section aria-labelledby="sub">
    <h2 id="sub">Listen in a podcast app</h2>
    <div class="subscribe"><span>Apple Podcasts</span><span>Spotify</span><span>Pocket Casts</span><span>RSS feed</span></div>
    <p class="hint">Links go live once the feed is approved.</p>
  </section>`;
}

function viewMasechta(slug) {
  const m = BY_SLUG[slug]; if (!m) return viewMissing();
  const list = state.sort === "asc" ? m.shiurim : [...m.shiurim].reverse();
  const total = m.shiurim.reduce((a, s) => a + s.dur, 0);
  return `
  <nav class="crumbs"><a href="#home">Masechtos</a><span>›</span><span>${m.name}</span></nav>
  <section class="mhead">
    <span class="eyebrow">Season ${m.season} · Seder ${SEDARIM.find(s => s.key === m.seder).en}</span>
    <h1>Ein Yaakov on ${m.name}</h1>
    <div class="he" lang="he">עין יעקב · ${m.he}</div>
    <p class="muted num">${m.shiurim.length} shiurim · ${Math.round(total / 3600)} hours · ${fmtDate(m.shiurim[0].given)} to ${fmtDate(m.shiurim.at(-1).given)}</p>
  </section>
  <section>
    <div class="tools">
      <form class="dafjump" id="dafjump" data-m="${m.slug}"><label for="dafIn">Go to daf</label><input id="dafIn" placeholder="17a" inputmode="text" autocomplete="off"><button class="btn ghost">Go</button></form>
      <div class="seg" role="group" aria-label="Order"><button data-sort="asc" aria-pressed="${state.sort === "asc"}">By daf</button><button data-sort="desc" aria-pressed="${state.sort === "desc"}">Newest</button></div>
    </div>
    ${state.dafMsg ? `<div class="notice">${state.dafMsg}</div>` : ""}
    <ul class="list">${list.map(s => row(s)).join("")}</ul>
  </section>`;
}

function viewShiur(id) {
  const s = BY_ID[id]; if (!s) return viewMissing();
  const i = s.number - 1, prev = s.m.shiurim[i - 1], next = s.m.shiurim[i + 1];
  const p = player.id === s.id ? player.pos : 0;
  return `
  <nav class="crumbs"><a href="#home">Masechtos</a><span>›</span><a href="#m-${s.m.slug}">${s.m.name}</a><span>›</span><span>Shiur ${s.number}</span></nav>
  <section class="shead">
    <span class="eyebrow">Ein Yaakov on ${s.m.name} · Shiur ${s.number}</span>
    <h1>${esc(s.title)}</h1>
    <div class="dafline"><span class="daf num">Daf ${dafRange(s)}</span><span class="he" lang="he">${s.m.he} ${heRange(s)}</span><span class="muted num">${fmtDate(s.given)}</span></div>
  </section>
  <section class="playcard" aria-label="Player">
    <div class="prow">
      <button class="big-play" data-play="${s.id}" aria-label="${playing(s.id) ? "Pause" : "Play"}">${playing(s.id) ? PAUSE : PLAY}</button>
      <div class="bar" data-seek="${s.id}"><i style="width:${p / s.dur * 100}%"></i></div>
      <span class="time num" data-time="${s.id}">${fmtTime(p)} / ${fmtTime(s.dur)}</span>
    </div>
    <div class="prow">
      <button class="small-btn" data-skip="-15">−15 s</button>
      <button class="small-btn" data-skip="30">+30 s</button>
      <button class="small-btn" data-rate>${player.rate}×</button>
      <span class="small-btn" style="margin-left:auto" title="Download goes live with real audio">Download MP3</span>
    </div>
  </section>
  <section>
    <h2>Summary</h2>
    <p class="prose" style="margin:0">${esc(s.summary)}</p>
  </section>
  <section>
    <h2>Chapters</h2>
    <ol class="chapters">${chaptersFor(s).map(([t, c]) => `<li><button data-jump="${s.id}:${t}"><span class="ts">${fmtTime(t)}</span><span>${esc(c)}</span></button></li>`).join("")}</ol>
  </section>
  <section>
    <details class="tx" open><summary>Transcript</summary>
      <div class="transcript">${transcriptFor(s).map(([t, x]) => `<p><span class="ts">${fmtTime(t)}</span>${esc(x)}</p>`).join("")}
      <p class="hint">Sample text. The real transcript is server-rendered in full so search engines can index it.</p></div>
    </details>
  </section>
  <nav class="pn" aria-label="Previous and next shiur">
    ${prev ? `<a href="#s-${prev.id}"><small>← Shiur ${prev.number} · ${dafRange(prev)}</small><span>${esc(prev.title)}</span></a>` : "<span></span>"}
    ${next ? `<a class="next" href="#s-${next.id}"><small>Shiur ${next.number} · ${dafRange(next)} →</small><span>${esc(next.title)}</span></a>` : "<span></span>"}
  </nav>`;
}

function viewSearch() {
  const r = search(state.q, state.slug);
  const m = r.slug ? BY_SLUG[r.slug] : null;
  let top = "";
  if (r.dafHit) {
    if (r.dafHit.error) top = `<div class="notice">${r.dafHit.error}</div>`;
    else if (r.dafHit.hit) top = `<div class="notice">${m.name} ${r.dafHit.daf} is covered in <a href="#s-${r.dafHit.hit.id}">Shiur ${r.dafHit.hit.number}: ${esc(r.dafHit.hit.title)}</a>.</div>`;
    else top = `<div class="notice">No shiur covers ${m.name} ${r.dafHit.daf} yet. The closest is <a href="#s-${r.dafHit.near.id}">Shiur ${r.dafHit.near.number} on ${dafRange(r.dafHit.near)}</a>.</div>`;
  }
  const label = r.terms.length ? `${r.results.length} result${r.results.length === 1 ? "" : "s"}${m ? " in " + m.name : ""}` : m ? `All shiurim in ${m.name}` : "All shiurim";
  return `
  <h1>Search</h1>
  ${finder(state.q, r.slug || "")}
  ${top}
  ${r.dafHit && !r.terms.length ? "" : `<section>
    <div class="sec-head"><h2>${label}</h2></div>
    ${r.results.length ? `<ul class="list">${r.results.map(s => row(s, { showM: !m, snip: true, terms: r.terms })).join("")}</ul>`
      : `<p class="muted">Nothing matched “${esc(r.terms.join(" "))}”${m ? " in " + m.name : ""}. Try fewer words${m ? ", or search all masechtos" : ""}.</p>`}
  </section>`}`;
}

function viewAbout() {
  return `
  <section class="prose">
    <span class="eyebrow">About the shiur</span>
    <h1>Ein Yaakov with ${RAV}</h1>
    <p>A weekly shiur on the aggados of the Gemara as collected in the Ein Yaakov, going masechta by masechta. Every shiur since the beginning is here, dated by when it was given.</p>
    <h2>When and where</h2>
    <p class="muted">Day, time and location to be filled in.</p>
    <h2>Dedications</h2>
    <p class="muted">Dedication options to be filled in.</p>
  </section>`;
}
function viewMissing() { return `<section><h1>Shiur not found</h1><p>That page doesn't exist. <a href="#home">Browse the masechtos</a>.</p></section>`; }

// ---------- Simulated player ----------
const player = { id: null, pos: 0, on: false, rate: 1, timer: null };
const RATES = [1, 1.25, 1.5, 1.75, 2];
const playing = id => player.on && player.id === id;
function load(id, at) { if (player.id !== id) { player.id = id; player.pos = 0; } if (at != null) player.pos = at; }
function toggle(id) { if (player.id === id && player.on) { player.on = false; } else { load(id); player.on = true; } tick(true); }
function tick(repaint) {
  clearInterval(player.timer);
  if (player.on) player.timer = setInterval(() => { const s = BY_ID[player.id]; player.pos = Math.min(s.dur, player.pos + player.rate); if (player.pos >= s.dur) player.on = false; paintPlayer(); if (!player.on) tick(true); }, 1000);
  if (repaint) { paintPlayer(true); }
}
function paintPlayer(full) {
  const s = BY_ID[player.id]; const mini = document.getElementById("mini");
  if (!s) { mini.hidden = true; return; }
  mini.hidden = false;
  document.getElementById("miniPlay").innerHTML = player.on ? PAUSE : PLAY;
  document.getElementById("miniPlay").setAttribute("aria-label", player.on ? "Pause" : "Play");
  const t = document.getElementById("miniTitle"); t.textContent = `${s.m.name} ${dafRange(s)} · ${s.title}`; t.href = "#s-" + s.id;
  document.getElementById("miniRate").textContent = player.rate + "×";
  document.querySelector("#miniBar i").style.width = (player.pos / s.dur * 100) + "%";
  document.querySelectorAll(`[data-seek="${s.id}"] i`).forEach(el => el.style.width = (player.pos / s.dur * 100) + "%");
  document.querySelectorAll(`[data-time="${s.id}"]`).forEach(el => el.textContent = `${fmtTime(player.pos)} / ${fmtTime(s.dur)}`);
  if (full) document.querySelectorAll("[data-play]").forEach(b => {
    const on = playing(b.dataset.play);
    if (b.classList.contains("big-play")) { b.innerHTML = on ? PAUSE : PLAY; b.setAttribute("aria-label", on ? "Pause" : "Play"); }
    else b.textContent = on ? "Pause" : "Play shiur";
  });
  document.querySelectorAll("[data-rate]").forEach(b => b.textContent = player.rate + "×");
}

// ---------- Routing ----------
function route() {
  const h = location.hash.slice(1) || "home";
  let html, nav = "home";
  if (h === "home") html = viewHome();
  else if (h === "search") { html = viewSearch(); nav = "search"; }
  else if (h === "about") { html = viewAbout(); nav = "about"; }
  else if (h.startsWith("m-")) html = viewMasechta(h.slice(2));
  else if (h.startsWith("s-")) html = viewShiur(h.slice(2));
  else html = viewMissing();
  document.getElementById("view").innerHTML = html;
  document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav === nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  paintPlayer(true);
}
function go(hash) { if (location.hash === "#" + hash) route(); else location.hash = hash; window.scrollTo(0, 0); }

document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "finder") { state.q = e.target.q.value; go("search"); }
  if (e.target.id === "dafjump") {
    const m = BY_SLUG[e.target.dataset.m]; const r = findDaf(m, e.target.dafIn.value.trim());
    if (r.hit) { state.dafMsg = ""; go("s-" + r.hit.id); }
    else { state.dafMsg = r.error || `No shiur covers ${m.name} ${r.daf} yet. The closest is <a href="#s-${r.near.id}">Shiur ${r.near.number} on ${dafRange(r.near)}</a>.`; route(); document.getElementById("dafIn").value = e.target.dafIn?.value || ""; }
  }
});
document.addEventListener("click", e => {
  const b = e.target.closest("button, [data-seek]"); if (!b) return;
  if (b.dataset.chipM !== undefined) { e.preventDefault(); state.slug = b.dataset.chipM; const q = document.getElementById("q"); if (q) state.q = q.value; go("search"); }
  else if (b.dataset.play) toggle(b.dataset.play);
  else if (b.dataset.sort) { state.sort = b.dataset.sort; route(); }
  else if (b.dataset.skip) { if (!player.id) return; player.pos = Math.max(0, Math.min(BY_ID[player.id].dur, player.pos + +b.dataset.skip)); paintPlayer(); }
  else if (b.dataset.rate !== undefined || b.id === "miniRate") { player.rate = RATES[(RATES.indexOf(player.rate) + 1) % RATES.length]; paintPlayer(true); tick(); }
  else if (b.dataset.jump) { const [id, t] = b.dataset.jump.split(":"); load(id, +t); player.on = true; tick(true); }
  else if (b.id === "miniPlay") toggle(player.id);
  else if (b.dataset.seek) { const s = BY_ID[b.dataset.seek]; const r = b.getBoundingClientRect(); load(s.id, (e.clientX - r.left) / r.width * s.dur); paintPlayer(true); }
});
document.getElementById("miniBar").addEventListener("click", e => { if (!player.id) return; const r = e.currentTarget.getBoundingClientRect(); player.pos = (e.clientX - r.left) / r.width * BY_ID[player.id].dur; paintPlayer(); });
window.addEventListener("hashchange", () => { if (!location.hash.startsWith("#m-")) state.dafMsg = ""; route(); });
route();
</script>
